name: Convert vehicles

on:
  workflow_dispatch:
  push:
    paths:
      - 'vehicles.raw.json'
      - 'tools/convert_vehicles.py'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate data/vehicles.json
        run: python tools/convert_vehicles.py vehicles.raw.json data/vehicles.json
      - name: Commit the result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/vehicles.json
          git commit -m "Regenerate vehicles.json" || echo "No changes"
          git push
